<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture ideas before they disappear.</p>
    </header>

    <main>
      <section>
        <h2>Add a note</h2>
        <form id="note-form">
          <div class="form-field grow">
            <label for="note-input">New note</label>
            <input
              type="text"
              id="note-input"
              name="note"
              placeholder="Type a note..."
            />
          </div>
          <div class="form-field">
            <label for="category-select">Category</label>
            <select id="category-select" name="category">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="study">Study</option>
            </select>
          </div>
          <button type="submit">Add Note</button>
        </form>
        <p id="error-message" role="alert"></p>
      </section>

      <section>
        <h2>Your notes</h2>
        <label for="search-input">Search notes</label>
        <input type="search" id="search-input" placeholder="Search..." />
        <p id="note-count">You have no notes yet.</p>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes - Note it, Brain it.</p>
    </footer>
    <script src="script.js" defer></script>
  </body>
</html>
